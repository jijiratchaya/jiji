<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>AR Long Neck Dinosaur</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <!-- Animation Mixer สำหรับเล่น Animation ใน GLB -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .info {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 10px 18px;
      border-radius: 20px;

      background: rgba(0, 0, 0, 0.65);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="info">
    ส่องกล้องไปที่ Hiro Marker 🦕
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          detectionMode: mono;
          trackingMethod: best;">

    <!-- Assets -->
    <a-assets>
      <a-asset-item
        id="dinosaur"
        src="./dinosaur.glb">
      </a-asset-item>
    </a-assets>

    <!-- Hiro Marker -->
    <a-marker preset="hiro">

      <!-- พื้น -->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="3"
        height="3"
        color="#78A55A"
        opacity="0.45">
      </a-plane>

      <!-- ไดโนเสาร์คอยาว -->
      <a-entity
        id="dino"
        gltf-model="#dinosaur"

        position="0 0 0"
        rotation="0 90 0"
        scale="0.25 0.25 0.25"

        animation-mixer="clip: *;
                         loop: repeat;
                         timeScale: 1;"

        animation="property: position;
                   from: -0.8 0 0;
                   to: 0.8 0 0;
                   dur: 6000;
                   dir: alternate;
                   loop: true;
                   easing: linear;">
      </a-entity>

    </a-marker>

    <!-- AR Camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
